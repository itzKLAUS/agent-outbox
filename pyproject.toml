[project]
name = "agent-outbox"
version = "0.2.0"
description = "Transactional action dispatch with fenced leases and uncertain-outcome recovery"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "itzKLAUS"}]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.18,<3", "build>=1.6.1,<2"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = [".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"examples/*" = ["S101"]

[tool.mypy]
strict = true

[project.urls]
Repository = "https://github.com/itzKLAUS/agent-outbox"
Issues = "https://github.com/itzKLAUS/agent-outbox/issues"
